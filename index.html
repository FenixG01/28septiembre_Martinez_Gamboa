<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Diagramas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f5f4;
      color: #25332b;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      background: white;
      border: 1px solid #e2e8e4;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 24px #25332b08;
      animation: aparecer 0.5s ease;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    h2 {
      margin: 0;
      font-size: 17px;
      font-weight: normal;
    }

    p {
      margin: 12px 0 28px;
      color: #738078;
      font-size: 14px;
    }

    .button-group {
      display: grid;
      gap: 12px;
    }

    .button-group a {
      padding: 14px;
      border: 1px solid #dce6df;
      border-radius: 8px;
      background: #f5f8f6;
      color: #315640;
      text-decoration: none;
      font-size: 15px;
      transition: background 0.2s, transform 0.2s;
    }

    .button-group a:hover {
      background: #e5efe8;
      transform: translateY(-2px);
    }

    .button-group a:focus-visible {
      outline: 2px solid #315640;
      outline-offset: 3px;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Diagramas</h1>
    <h2>Brandon Martínez Gamboa</h2>
    <p>Portal de mis prácticas.</p>

    <nav class="button-group" aria-label="Mis prácticas">
      <a href="Brandon_Ex.html">Idea Principal</a>
      <a href="negocio_brandon.html">Como funciona?</a>
      <a href="monetizar.html">Monetizar</a>
      <a href="vender.html">Vender</a>
    </nav>
  </main>
</body>
</html>
